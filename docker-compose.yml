services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artixio_triage
      POSTGRES_USER: artixio
      POSTGRES_PASSWORD: artixio_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artixio -d artixio_triage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
